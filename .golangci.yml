# golangci-lint configuration (v2). The default linters (errcheck, govet, ineffassign, staticcheck, unused) stay on; revive adds the documentation rules
# of the workspace's documentation standard (D144), so a missing or malformed doc comment fails CI instead of waiting for a review.
version: "2"
linters:
  enable:
    - revive
  settings:
    revive:
      rules:
        # Every exported identifier has a doc comment that starts with its name.
        - name: exported
        # The package has one doc comment, written as "Package name ...".
        - name: package-comments
        # "//comment" must be "// comment": a missing space hides a comment from godoc.
        - name: comment-spacings
