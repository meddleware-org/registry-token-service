name: Publish (Docker)
# Release pipeline for registry-token-service. Fires on version tags (v*).
#
# Supply-chain controls (verifiable by any anonymous operator):
#   - Multi-arch build (linux/amd64, linux/arm64) via Buildx/QEMU
#   - SBOM (SPDX) + SLSA provenance attached to the image by BuildKit
#   - Keyless cosign signatures (Sigstore Fulcio/Rekor) over the image digest
#   - GitHub-native build-provenance attestation
#   - `latest` is published ONLY for stable (non-pre-release) semver tags
#
# Public registries (quay.io, Docker Hub) get the full treatment. The self-hosted
# registry push is best-effort (continue-on-error) since it may not exist yet.
#
# Required repository configuration:
#   Secrets: QUAY_USERNAME/QUAY_TOKEN, DOCKERHUB_USERNAME/DOCKERHUB_TOKEN,
#            PRIVATE_REGISTRY_USERNAME/PRIVATE_REGISTRY_TOKEN
#   Vars (optional overrides): QUAY_NAMESPACE, DOCKERHUB_NAMESPACE,
#            PRIVATE_REGISTRY, PRIVATE_NAMESPACE, VENDOR, DESCRIPTION,
#            SOURCE_URL, DOCUMENTATION_URL, IMAGE_URL

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: registry-token-service

permissions:
  contents: read

jobs:
  verify:
    name: Verify (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...

  publish-public:
    name: Publish (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            VENDOR=${{ vars.VENDOR || 'Meddleware' }}
            DESCRIPTION=${{ vars.DESCRIPTION || 'Distribution registry JWT token service backed by Ory Hydra + Keto.' }}
            SOURCE_URL=${{ vars.SOURCE_URL || 'https://github.com/meddleware-org/registry-token-service' }}
            DOCUMENTATION_URL=${{ vars.DOCUMENTATION_URL || 'https://github.com/meddleware-org/registry-token-service#readme' }}
            IMAGE_URL=${{ vars.IMAGE_URL || 'https://quay.io/meddleware-org/registry-token-service' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # SBOM of the published image, attached as a signed cosign attestation (SPDX JSON).
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "Published & signed @ digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-private:
    name: Publish (self-hosted registry)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}/${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            VENDOR=${{ vars.VENDOR || 'Meddleware' }}
            DESCRIPTION=${{ vars.DESCRIPTION || 'Distribution registry JWT token service backed by Ory Hydra + Keto.' }}
            SOURCE_URL=${{ vars.SOURCE_URL || 'https://github.com/meddleware-org/registry-token-service' }}
            DOCUMENTATION_URL=${{ vars.DOCUMENTATION_URL || 'https://github.com/meddleware-org/registry-token-service#readme' }}
            IMAGE_URL=${{ vars.IMAGE_URL || 'https://quay.io/meddleware-org/registry-token-service' }}
      - name: Summary
        if: always()
        run: |
          echo "Pushed to private registry @ ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}" >> "$GITHUB_STEP_SUMMARY"
